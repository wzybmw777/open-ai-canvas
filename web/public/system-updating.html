<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="refresh" content="15" />
        <meta name="description" content="系统正在更新，请稍候。" />
        <title>系统更新中</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #0b0d0f;
                color: #f5f7fa;
            }
            * {
                box-sizing: border-box;
            }
            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background: radial-gradient(circle at 50% 0%, rgba(91, 111, 255, 0.18), transparent 46%), #0b0d0f;
            }
            main {
                width: min(100%, 480px);
                padding: 44px 36px;
                text-align: center;
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 24px;
                background: rgba(20, 24, 30, 0.9);
                box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            }
            .mark {
                width: 56px;
                height: 56px;
                margin: 0 auto 24px;
                display: grid;
                place-items: center;
                border: 1px solid rgba(166, 177, 255, 0.48);
                border-radius: 16px;
                color: #b9c0ff;
                font-size: 26px;
            }
            h1 {
                margin: 0;
                font-size: clamp(28px, 6vw, 36px);
                letter-spacing: 0.04em;
            }
            p {
                margin: 16px 0 0;
                color: rgba(245, 247, 250, 0.72);
                line-height: 1.8;
            }
            .hint {
                margin-top: 10px;
                color: rgba(245, 247, 250, 0.46);
                font-size: 14px;
            }
            @media (prefers-reduced-motion: no-preference) {
                .mark {
                    animation: pulse 2s ease-in-out infinite;
                }
                @keyframes pulse {
                    50% {
                        transform: translateY(-3px);
                        opacity: 0.72;
                    }
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="mark" aria-hidden="true">↻</div>
            <h1>系统更新中</h1>
            <p>系统正在更新，请稍候片刻。更新完成后页面会自动恢复。</p>
            <p class="hint">页面会自动刷新，无需重复操作。</p>
        </main>
    </body>
</html>
